version: '3.8'

services:
  mmo-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: mmo-test-server
    networks:
      - mmo-test-network
    ports:
      - "7777:7777"
    environment:
      - ASPNETCORE_ENVIRONMENT=Testing
      - LOG_LEVEL=Debug
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/7777' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - ./logs/server:/app/logs

  integration-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.tests
    networks:
      - mmo-test-network
    environment:
      - SERVER_HOST=mmo-server
      - SERVER_PORT=7777
    depends_on:
      mmo-server:
        condition: service_healthy
    volumes:
      - ./test-results:/app/test-results

networks:
  mmo-test-network:
    driver: bridge
