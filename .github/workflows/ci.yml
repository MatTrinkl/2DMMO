name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Mmo.sln

      - name: Build
        run: dotnet build Mmo.sln --configuration Release --no-restore

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Mmo.sln

      - name: Run Shared Tests
        run: dotnet test tests/Mmo.Shared.Tests --no-restore --verbosity normal --logger "trx;LogFileName=shared-test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: tests/Mmo.Shared.Tests/TestResults/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Mmo.sln

      - name: Run Server Tests
        run: dotnet test tests/Mmo.Server.Tests --no-restore --verbosity normal --logger "trx;LogFileName=server-test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: tests/Mmo.Server.Tests/TestResults/

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Mmo.sln

      # Tests mit Coverage ausführen
      - name: Run all tests with coverage
        run: |
          dotnet test Mmo.sln \
            --no-restore \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      # ReportGenerator installieren und Report erstellen
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:./coverage/**/coverage.cobertura.xml \
            -targetdir:./coverage-report \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub;Badges"

      # Coverage Summary als PR Comment
      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: './coverage/**/coverage.cobertura.xml'
          badge: true
          format: markdown
          output: both
          thresholds: '50 70'
          fail_below_min: false

      # PR Comment mit Coverage
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

      # Coverage Report als Artifact hochladen
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage-report/
          retention-days: 14

      # Coverage Badge für README
      - name: Upload Coverage Badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: ./coverage-report/badge_combined.svg

      # Threshold Check - Warnung bei niedrigem Coverage
      - name: Check Coverage Threshold
        run: |
          echo "## Coverage Threshold Check" >> $GITHUB_STEP_SUMMARY
          
          # Parse line coverage from cobertura report
          COVERAGE_FILE=$(find ./coverage -name "coverage.cobertura.xml" | head -1)
          if [ -f "$COVERAGE_FILE" ]; then
            LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' "$COVERAGE_FILE" | head -1)
            COVERAGE_PERCENT=$(echo "$LINE_RATE * 100" | bc -l | xargs printf "%.1f")
            
            echo "📊 Line Coverage: ${COVERAGE_PERCENT}%" >> $GITHUB_STEP_SUMMARY
            
            # Thresholds
            MIN_COVERAGE=50
            TARGET_COVERAGE=70
            
            if (( $(echo "$LINE_RATE < 0.${MIN_COVERAGE}" | bc -l) )); then
              echo "❌ Coverage ist unter ${MIN_COVERAGE}% - Build sollte fehlschlagen!" >> $GITHUB_STEP_SUMMARY
              echo "::error::Line Coverage ${COVERAGE_PERCENT}% ist unter dem Minimum von ${MIN_COVERAGE}%"
              # Für Prototyp nur Warnung, später: exit 1
            elif (( $(echo "$LINE_RATE < 0.${TARGET_COVERAGE}" | bc -l) )); then
              echo "⚠️ Coverage ist unter ${TARGET_COVERAGE}% - Bitte mehr Tests schreiben!" >> $GITHUB_STEP_SUMMARY
              echo "::warning::Line Coverage ${COVERAGE_PERCENT}% ist unter dem Ziel von ${TARGET_COVERAGE}%"
            else
              echo "✅ Coverage ist über ${TARGET_COVERAGE}% - Sehr gut!" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Keine Coverage-Datei gefunden" >> $GITHUB_STEP_SUMMARY
          fi

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Mmo.sln

      - name: Check code formatting
        run: dotnet format Mmo.sln --verify-no-changes --verbosity diagnostic

      - name: Build with warnings as errors
        run: dotnet build Mmo.sln --configuration Release -warnaserror

  mutation-tests:
    name: Mutation Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Stryker.NET
        run: dotnet tool install -g dotnet-stryker

      - name: Restore dependencies
        run: dotnet restore Mmo.sln

      - name: Run mutation tests
        working-directory: tests/Mmo.Server.Tests
        run: dotnet stryker --reporter "html" --reporter "progress" --break-at 60
        continue-on-error: true

      - name: Upload Stryker report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: tests/Mmo.Server.Tests/StrykerOutput/
          retention-days: 14

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Mmo.sln

      - name: Run security scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee security-report.txt
          if grep -q "has the following vulnerable packages" security-report.txt; then
            echo "::warning::Vulnerable packages found"
          fi

