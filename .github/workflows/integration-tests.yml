name: Integration Tests

on:
  push:
    branches: [main, develop, ServiceImplementation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Images
        run: docker compose -f docker-compose.test.yml build
      
      - name: Start Server
        run: docker compose -f docker-compose.test.yml up -d mmo-server
      
      - name: Wait for Server Health
        run: |
          echo "Waiting for server to be healthy..."
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml ps | grep -q "healthy"; then
              echo "✅ Server is healthy!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          echo "❌ Server failed to become healthy"
          docker compose -f docker-compose.test.yml logs mmo-server
          exit 1
      
      - name: Run Integration Tests
        run: docker compose -f docker-compose.test.yml run --rm integration-tests
      
      - name: Collect Logs
        if: always()
        run: |
          docker compose -f docker-compose.test.yml logs mmo-server > server-logs.txt
          echo "Server logs collected"
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            server-logs.txt
            test-results/
          retention-days: 14
      
      - name: Upload Server Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-failed
          path: server-logs.txt
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
